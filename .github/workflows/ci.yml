
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: messaging_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/messaging_dev
      REDIS_URL: redis://127.0.0.1:6379
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-v1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-v1-

      - name: Configure pnpm store path
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Configure .npmrc for GitHub Packages
        run: |
          echo "@returnacy:registry=https://npm.pkg.github.com/" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
          # Also patch workspace .npmrc to avoid env substitution warnings during pnpm install
          if [ -f ".npmrc" ]; then cp .npmrc .npmrc.ci; fi
          if [ -f "./.npmrc" ]; then sed -i 's/${GITHUB_PACKAGES_TOKEN}/${{ secrets.GITHUB_TOKEN }}/g' .npmrc || true; fi

      - name: Ensure @returnacy/event-contracts is available
        run: pnpm view @returnacy/event-contracts version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: db
        run: pnpm prisma generate --schema=./prisma/schema.prisma

      - name: Build db package (needed for seed)
        run: pnpm --filter @messaging-service/db build

      - name: Apply migrations & seed (local Postgres)
        working-directory: db
        run: pnpm prisma migrate deploy --schema=./prisma/schema.prisma && pnpm prisma db seed --schema=./prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build packages
        run: |
          pnpm --filter @messaging-service/dispatcher build
          pnpm --filter @messaging-service/scheduler build
          pnpm --filter @messaging-service/server build

      - name: Typecheck
        run: pnpm -r exec tsc --noEmit --pretty false --skipLibCheck

      - name: Run server tests
        run: pnpm --filter @messaging-service/server test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}

      - name: Run dispatcher tests
        run: pnpm --filter @messaging-service/dispatcher test
        env:
          REDIS_URL: ${{ env.REDIS_URL }}
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run scheduler tests
        run: pnpm --filter @messaging-service/scheduler test
        env:
          REDIS_URL: ${{ env.REDIS_URL }}
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run db tests
        run: pnpm --filter @messaging-service/db test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

  docker:
    name: Build Docker Images
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [server, dispatcher, scheduler]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure .npmrc for Docker build
        run: |
          echo "@returnacy:registry=https://npm.pkg.github.com/" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Build ${{ matrix.service }} Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          build-args: |
            GITHUB_PACKAGES_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: Image build summary
        run: echo "Built ${{ matrix.service }} Docker image."
